twig:
    file_name_pattern: '*.twig'
    globals:
        website_name: '%app.website_name%'
        website_url: '%app.website_url%'

        webapp_name: '%app.webapp_name%'
        webapp_url: '%app.webapp_url%'

        ucad_webapp_name: '%app.ucad_webapp_name%'
        ucad_webapp_url: '%app.ucad_webapp_url%'
        
        website_email: '%app.website_email%'
        website_phone: '%app.website_phone%'

        ise_admission_concours: '%app.ise_admission_concours%'
        ise_admission_concours_url: '%app.ise_admission_concours_url%'

        ise_admission_formations: '%app.ise_admission_formations%'
        ise_admission_formations_url: '%app.ise_admission_formations_url%'

        admission_test_period: '%app.admission_test_period%'

when@test:
    twig:
        strict_variables: true
